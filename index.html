<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal Copsa</title>
<link rel="icon" href="assets/copsa-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo:#E91C24; --rojo-txt:#B3121A; --rojo-ico:#C8151C; --rojo-bg:#FDECEC;
    --tinta:#1A1A1A; --gris:#5B5F66; --gris-osc:#3F4349;
    --fondo:#F4F4F2; --blanco:#FFFFFF; --borde:#E2E2DE; --borde-suave:#EDEDE9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Archivo,system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  .franja{height:5px;background:var(--rojo)}
  header{background:var(--blanco);border-bottom:1px solid var(--borde)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px}
  .head{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
  .head img{height:40px;width:auto;display:block}
  .sep{width:1px;height:32px;background:var(--borde)}
  .titulo{display:flex;flex-direction:column;gap:1px;flex:1 1 200px}
  .titulo b{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .titulo span{font-size:13px;color:var(--gris)}
  .buscar{display:flex;align-items:center;gap:8px;background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:0 12px;height:40px;flex:0 1 300px;min-width:200px}
  .buscar:focus-within{border-color:var(--tinta)}
  .buscar input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--tinta);outline:none;width:100%}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  main{padding-top:18px;padding-bottom:40px;display:flex;flex-direction:column;gap:18px}
  .filtros{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid #D4D4CF;background:var(--blanco);color:var(--tinta);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff;font-weight:600}
  .chip:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}

  /* Paneles por sector: se acomodan solos según el ancho de pantalla */
  .sectores{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;align-items:start}
  .panel{background:var(--blanco);border:1px solid var(--borde);border-radius:12px;overflow:hidden}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:13px 16px 11px;border-bottom:1px solid #D6D6D0}
  .panel-head h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid var(--rojo);padding-left:8px}
  .panel-head span{font-size:12px;color:var(--gris)}

  .item{display:flex;align-items:center;gap:16px;padding:18px 18px;min-height:112px;border-top:1px solid #D6D6D0}
  .panel-head + .item{border-top:0}
  .item-wrap{border-top:1px solid #D6D6D0}
  .panel-head + .item-wrap{border-top:0}
  .item-wrap .item{border-top:0;padding-bottom:10px;min-height:96px}
  .ayuda{display:flex;align-items:center;gap:6px;margin:0 18px 14px 82px;font-size:13px;font-weight:600;color:var(--rojo-txt);text-decoration:underline;text-underline-offset:3px;width:fit-content}
  .ayuda:hover{color:var(--rojo)}
  .ayuda:focus-visible{outline:3px solid var(--rojo);outline-offset:2px;border-radius:4px}
  a.item:hover{background:#FBF4F4}
  a.item:hover .nombre{color:var(--rojo-txt)}
  a.item:focus-visible{outline:3px solid var(--rojo);outline-offset:-3px}
  .ico{flex:none;width:48px;height:48px;border-radius:11px;background:var(--rojo-bg);color:var(--rojo-ico);display:flex;align-items:center;justify-content:center}
  .item.bat .ico{background:#ECEEF1;color:var(--gris-osc)}
  .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .nombre{font-size:17px;font-weight:700;line-height:1.2}
  .meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
  .tags{display:flex;gap:6px}
  .desc{font-size:13.5px;line-height:1.4;color:var(--gris);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tag{flex:none;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 5px;white-space:nowrap}
  .tag.nuevo{color:#7A4A00;background:#FFF1D6}
  .tag.dev{color:var(--gris-osc);background:#F0F0EC}
  .tag.bat{color:var(--gris-osc);background:#ECEEF1}
  .flecha{flex:none;color:var(--rojo-txt);display:flex}
  .item.prox{cursor:default}
  .item.prox .nombre,.item.prox .ico{opacity:.6}

  .vacio{color:var(--gris);font-size:14px;padding:16px 0}
.pedir{color:var(--rojo-txt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .pedir:hover{color:var(--rojo)}
  footer{border-top:1px solid var(--borde);background:var(--blanco)}
  .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;font-size:12.5px;color:var(--gris)}
</style>
</head>
<body>
<div class="franja"></div>
<header>
  <div class="wrap head">
    <img src="assets/copsa-logo.png" alt="Copsa - Combustibles, Químicos y Especialidades S.A.">
    <div class="sep"></div>
    <div class="titulo">
      <b>Portal Copsa</b>
      <span>Monitores, aplicaciones y scripts internos</span>
    </div>
    <label class="buscar">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B5F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Buscar herramienta</span>
      <input id="buscar" type="search" placeholder="Buscar herramienta…" autocomplete="off">
    </label>
  </div>
</header>

<main class="wrap">
  <nav id="filtros" class="filtros" aria-label="Filtrar por sector"></nav>
  <div id="contenido"></div>
</main>

<footer>
  <div class="wrap foot">
    <span>Petrolera Copsa S.A. · Uso interno</span>
    <a class="pedir" href="mailto:pedidos@petroleracopsa.com.ar?subject=Portal%20Copsa%20-%20Sumar%20herramienta&amp;body=Hola%2C%0A%0AQuisiera%20sumar%20una%20herramienta%20al%20Portal%20Copsa.%0A%0AQu%C3%A9%20necesito%3A%20%0APara%20qu%C3%A9%20sector%3A%20%0AQui%C3%A9n%20la%20usar%C3%ADa%3A%20%0ALink%20%28si%20ya%20existe%29%3A%20%0A%0AGracias.">¿Falta una herramienta? Pedí sumarla a SAC</a>
  </div>
</footer>

<script src="herramientas.js"></script>
<script>
const ICONOS = {
  ruta:      '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/>',
  usuario:   '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6"/><path d="M16 11h6"/>',
  reclamo:   '<path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6.2A8 8 0 1 1 21 12Z"/><path d="M12 8v4"/><path d="M12 15.5v.01"/>',
  balanza:   '<path d="M12 3v18"/><path d="M5 7h14"/><path d="m5 7-3 7a3 3 0 0 0 6 0Z"/><path d="m19 7-3 7a3 3 0 0 0 6 0Z"/><path d="M8 21h8"/>',
  monitor:   '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/><path d="m7 12 3-3 2 2 4-4"/>',
  script:    '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/>',
  camion:    '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  credito:   '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="m14 15 2 2 4-4"/>',
  cobranza:  '<circle cx="12" cy="12" r="9"/><path d="M15 9.5a3 3 0 0 0-3-1.5c-1.7 0-3 .9-3 2s1.3 1.8 3 2 3 .9 3 2-1.3 2-3 2a3 3 0 0 1-3-1.5"/><path d="M12 6.5v1.5"/><path d="M12 16v1.5"/>',
  documento: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>'
};
const FLECHA = '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>';
const MAIL   = '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>';
const BAJAR  = '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>';
const svg = (d, s, w) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

const sectores = [...new Set(HERRAMIENTAS.map(h => h.sector))];
let sectorActivo = 'Todos';

function item(h) {
  const bat = h.tipo === 'bat';
  const prox = h.estado === 'En desarrollo' || !h.link || h.link === '#';
  const info = esc(h.descripcion + (h.responsable ? ' · ' + h.responsable : ''));
  const tags =
    (h.estado === 'Nuevo' ? '<span class="tag nuevo">Nuevo</span>' : '') +
    (prox ? '<span class="tag dev">Próximamente</span>' : '') +
    (bat && !prox ? '<span class="tag bat">Script</span>' : '');
  const inner = `
    <span class="ico">${svg(ICONOS[h.icono] || ICONOS.monitor, 24, 2)}</span>
    <span class="txt">
      <span class="nombre">${esc(h.nombre)}</span>
      <span class="meta">${tags ? `<span class="tags">${tags}</span>` : ''}<span class="desc">${esc(h.descripcion)}</span></span>
    </span>
    ${prox ? '' : `<span class="flecha">${svg(bat ? BAJAR : FLECHA, 16, 2.5)}</span>`}`;
  if (prox) return `<div class="item prox ${bat ? 'bat' : ''}" title="${info}" aria-disabled="true">${inner}</div>`;
  const attrs = bat ? 'download' : 'target="_blank" rel="noopener"';
  const card = `<a class="item ${bat ? 'bat' : ''}" href="${esc(h.link)}" ${attrs} title="${info}">${inner}</a>`;
  if (!h.ayuda) return card;
  return `<div class="item-wrap">${card}<a class="ayuda" href="${esc(h.ayuda.link)}">${svg(MAIL, 14, 2)}<span>${esc(h.ayuda.texto)}</span></a></div>`;
}

function render() {
  const q = norm(document.getElementById('buscar').value.trim());
  const visibles = HERRAMIENTAS.filter(h =>
    (sectorActivo === 'Todos' || h.sector === sectorActivo) &&
    (!q || norm(h.nombre + ' ' + h.descripcion + ' ' + h.responsable + ' ' + h.sector).includes(q)));

  const html = sectores.map(s => {
    const items = visibles.filter(h => h.sector === s);
    if (!items.length) return '';
    return `<section class="panel">
      <div class="panel-head"><h2>${esc(s)}</h2><span>${items.length}</span></div>
      ${items.map(item).join('')}
    </section>`;
  }).join('');
  document.getElementById('contenido').innerHTML = html
    ? `<div class="sectores">${html}</div>`
    : '<p class="vacio">No hay herramientas que coincidan con la búsqueda.</p>';
}

function renderFiltros() {
  document.getElementById('filtros').innerHTML = ['Todos', ...sectores].map(s =>
    `<button type="button" class="chip" aria-pressed="${s === sectorActivo}" data-sector="${esc(s)}">${esc(s)}</button>`).join('');
}

document.getElementById('filtros').addEventListener('click', e => {
  const b = e.target.closest('button[data-sector]');
  if (!b) return;
  sectorActivo = b.dataset.sector;
  renderFiltros(); render();
});
document.getElementById('buscar').addEventListener('input', render);

renderFiltros(); render();
</script>
</body>
</html>
